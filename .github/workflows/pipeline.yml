name: Daily pipeline

# 1. notebooks/Ingest_data.ipynb  Open-Meteo API -> raw CSV files in the Neon bucket (weather/, cities/)
# 2. notebooks/Load_dwh.ipynb     raw CSV files -> Neon Postgres star schema (stg -> dwh)
# Executed notebooks are kept as a run artifact. Secrets: README.md

on:
  schedule:
    - cron: "30 5 * * *"          # every day 05:30 UTC – yesterday's weather is in the archive by then
  workflow_dispatch:

concurrency:
  group: weather-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STORAGE: s3
      STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL }}
      STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: 1 · Ingest – API -> bucket
        run: |
          mkdir -p output
          papermill notebooks/Ingest_data.ipynb output/Ingest_data.ipynb --cwd notebooks

      - name: 2 · Load DWH – bucket -> Postgres
        run: papermill notebooks/Load_dwh.ipynb output/Load_dwh.ipynb --cwd notebooks

      - name: Keep executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-${{ github.run_id }}
          path: output/
          retention-days: 30
